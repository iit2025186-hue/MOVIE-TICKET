spring.application.name=cineverse
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
cineverse.admin.email=${CINEVERSE_ADMIN_EMAIL:}
cineverse.admin.password=${CINEVERSE_ADMIN_PASSWORD:}
cineverse.demo-account.password=${CINEVERSE_DEMO_PASSWORD:MovieNight2026!}
cineverse.demo-admin.password=${CINEVERSE_DEMO_ADMIN_PASSWORD:AdminNight2026!}

# Development database only. H2 keeps this project runnable without MySQL.
spring.datasource.url=jdbc:h2:mem:cineverse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# The schema and sample data are recreated whenever the application restarts.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Keep the TMDB credential outside source control.
tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3
