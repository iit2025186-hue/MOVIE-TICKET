spring.application.name=cineverse
server.port=${PORT:8080}

# Development database only. H2 keeps this project runnable without MySQL.
spring.datasource.url=jdbc:h2:mem:cineverse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# The schema and sample data are recreated whenever the application restarts.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
